[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-relay"
version = "0.1.0"
description = "Shared task board and email message protocol for AI agents, with a no-repeat send ledger and human approval gates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Kevin Fairley" }]
keywords = ["agents", "email", "protocol", "task-board"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
agent-relay = "agent_relay.cli:main"

[project.urls]
Homepage = "https://github.com/kfairley9999/agent-relay"
Portfolio = "https://kfairley9999.github.io/"

[tool.setuptools.packages.find]
where = ["src"]
